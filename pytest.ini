[tool:pytest]
DJANGO_SETTINGS_MODULE = OpenRouterChats.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --reuse-db
    --nomigrations
    --cov=OpenRouterChats
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    -v
env_files = .env.test
testpaths = OpenRouterChats/Chats/tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests related to authentication
    teachers: marks tests related to teachers functionality
