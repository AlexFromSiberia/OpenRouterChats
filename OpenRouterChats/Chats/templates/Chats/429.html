{% extends 'Chats/base.html' %}

{% block title %}Превышен лимит запросов{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm text-center">
        <div class="card-body p-5">
          <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
          <h1 class="h3 mt-4 mb-3">Превышен лимит запросов</h1>
          <p class="text-muted mb-4">
            Вы отправили слишком много запросов за короткий промежуток времени.
            Пожалуйста, подождите несколько минут и попробуйте снова.
          </p>
          <a href="/" class="btn btn-primary">Вернуться на главную</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
