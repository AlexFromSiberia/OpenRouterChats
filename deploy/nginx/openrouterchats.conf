upstream openrouterchats {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name alexfromsiberia.ru www.alexfromsiberia.ru;
    
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name alexfromsiberia.ru www.alexfromsiberia.ru;

    ssl_certificate /etc/letsencrypt/live/alexfromsiberia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexfromsiberia.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    location /static/ {
        alias /var/www/openrouterchats/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://openrouterchats;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
    }
}
